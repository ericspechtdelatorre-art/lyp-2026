<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>IKEA_LANG Studio & Visualizer</title>
  <style>
    :root {
      --ikea-blue: #0058a3;
      --ikea-yellow: #ffdb00;
      --bg: #f4f4f4;
      --panel-bg: #ffffff;
      --text: #111111;
      --border: #d5d5d5;
      --code-font: "Courier New", Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--ikea-blue);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid var(--ikea-yellow);
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .badge {
      background: var(--ikea-yellow);
      color: var(--ikea-blue);
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }
    header h1 { font-size: 1.2rem; font-weight: normal; }

    /* TOOLBAR */
    .toolbar {
      background: #e9e9e9;
      padding: 8px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    button {
      background: var(--ikea-blue);
      color: #fff;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    select {
      padding: 7px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #fff;
      font-weight: 500;
    }

    /* WORKSPACE */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--panel-bg);
    }
    .panel-header {
      background: #fafafa;
      padding: 8px 15px;
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #555;
      border-bottom: 1px solid var(--border);
    }

    /* EDITOR */
    textarea#editor {
      flex: 1;
      padding: 15px;
      font-family: var(--code-font);
      font-size: 1rem;
      line-height: 1.5;
      border: none;
      outline: none;
      resize: none;
      background: #fff;
    }

    /* CONSOLE & VISUALIZER */
    .output-panel {
      flex: 1.2;
      display: flex;
      flex-direction: column;
    }
    .top-output {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-bottom: 2px solid var(--border);
      background: #1e1e1e;
      color: #79c0ff;
    }
    .top-output .panel-header {
      background: #111;
      color: var(--ikea-yellow);
      border-bottom: 1px solid #333;
    }
    #ascii-display {
      flex: 1;
      padding: 15px;
      font-family: var(--code-font);
      white-space: pre;
      overflow: auto;
      font-size: 0.95rem;
      line-height: 1.25;
      color: #5af78e;
    }

    .bottom-output {
      height: 180px;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
    }
    .bottom-output .panel-header {
      background: #161b22;
      color: #8b949e;
      border-bottom: 1px solid #30363d;
    }
    #console {
      flex: 1;
      padding: 10px 15px;
      font-family: var(--code-font);
      font-size: 0.85rem;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .err-msg { color: #ff7b72; }
    .success-msg { color: #7ee787; }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="badge">IKEA</div>
      <h1>IKEA_LANG // IDE & Renderizador de Mobiliario</h1>
    </div>
  </header>

  <div class="toolbar">
    <button onclick="ejecutarCodigo()">▶ Ensamblar y Montar</button>
    <label for="ejemplos">Cargar Plano:</label>
    <select id="ejemplos" onchange="cargarEjemplo()">
      <option value="mesa">Mesa LACK Regulable</option>
      <option value="estanteria">Estantería BILLY con Baldas</option>
      <option value="silla">Silla STIG</option>
    </select>
  </div>

  <div class="workspace">
    <!-- EDITOR -->
    <div class="panel">
      <div class="panel-header">Instrucciones de Montaje (.ikea)</div>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>

    <!-- SALIDA -->
    <div class="output-panel">
      <!-- VISOR ASCII -->
      <div class="top-output">
        <div class="panel-header">Vista Previa del Mueble Ensamblado</div>
        <div id="ascii-display">// Ejecuta un programa para ver el mueble ensamblado...</div>
      </div>
      <!-- CONSOLA DE TEXTO -->
      <div class="bottom-output">
        <div class="panel-header">Registro de Montaje (Consola)</div>
        <div id="console">Listo para abrir la caja.</div>
      </div>
    </div>
  </div>

  <script>
    // CATÁLOGO DE EJEMPLOS PRECARGADOS
    const EJEMPLOS = {
      mesa: `ABRIR_CAJA

// Configuramos una mesa LACK
PIEZA modelo = "Mesa LACK"
PIEZA patas = 2

// Añadimos las patas que faltan
ENCAJAR patas + 2

MOSTRAR "Ensamblando modelo:"
MOSTRAR modelo
MOSTRAR "Numero total de patas:"
MOSTRAR patas

// Dibuja el mueble dinámicamente según la cantidad de patas
DIBUJAR_MUEBLE "mesa"

CERRAR_CAJA`,

      estanteria: `ABRIR_CAJA

// Configuramos la clasica estanteria BILLY
PIEZA modelo = "Estanteria BILLY"
PIEZA baldas = 2

// Agregamos mas baldas para meter mas libros
ENCAJAR baldas + 2

MOSTRAR "Producto:"
MOSTRAR modelo
MOSTRAR "Numero de baldas interiores:"
MOSTRAR baldas

// Genera una estantería con tantas baldas como indique la variable 'baldas'
DIBUJAR_MUEBLE "estanteria"

CERRAR_CAJA`,

      silla: `ABRIR_CAJA

PIEZA modelo = "Silla STIG"
MOSTRAR modelo

DIBUJAR_MUEBLE "silla"

CERRAR_CAJA`
    };

    function cargarEjemplo() {
      const select = document.getElementById("ejemplos");
      document.getElementById("editor").value = EJEMPLOS[select.value];
    }

    // GENERADORES DINÁMICOS DE ARTE ASCII
    function generarMesaAscii(patas) {
      let patasStr = "";
      if (patas <= 2) {
        patasStr = "   |                     |\n   |                     |";
      } else if (patas === 3) {
        patasStr = "   |          |          |\n   |          |          |";
      } else {
        patasStr = "   |   |             |   |\n   |   |             |   |";
      }

      return (
`       _______________________
      /                      /|
     /                      //
    /______________________//|
   |______________________|/ |
` + patasStr + `
   (Montaje completado con ` + patas + ` patas)`
      );
    }

    function generarEstanteriaAscii(baldas) {
      let interior = "";
      for (let i = 1; i <= baldas; i++) {
        interior += "   |  [===]  [======]  [===]  |\n";
        interior += "   |==========================|\n";
      }

      return (
`    __________________________
   |                          |
   |   IKEA BILLY BOOKSHELF   |
   |==========================|
` + interior +
`   |                          |
   |__________________________|
   (Total de compartimentos/baldas: ` + baldas + `)`
      );
    }

    function generarSillaAscii() {
      return (
`         +-------+
         | STIG  |
         |       |
         +-------+
         |       |
      ___|_______|___
     /              /|
    /______________//
    |  |        |  |
    |  |        |  |
    |  |        |  |
    (Silla firme y lista para usar)`
      );
    }

    // EL INTÉRPRETE EN TIEMPO REAL
    function ejecutarCodigo() {
      const codigo = document.getElementById("editor").value;
      const consola = document.getElementById("console");
      const asciiDisplay = document.getElementById("ascii-display");

      consola.innerHTML = "";
      asciiDisplay.innerText = "";

      const lineas = codigo.split("\n");
      const piezas = {};
      let cajaAbierta = false;
      let logs = [];
      let dibujo = "";

      function log(msg, esError = false) {
        logs.push(esError ? `<span class="err-msg">❌ ${msg}</span>` : `> ${msg}`);
      }

      for (let i = 0; i < lineas.length; i++) {
        let linea = lineas[i].trim();
        let numPaso = i + 1;

        if (!linea || linea.startsWith("//")) continue;

        if (linea === "ABRIR_CAJA") {
          cajaAbierta = true;
          log("Caja abierta. Iniciando montaje.");
          continue;
        }

        if (!cajaAbierta) {
          log(`Error en línea ${numPaso}: Debes ABRIR_CAJA antes de manipular piezas.`, true);
          consola.innerHTML = logs.join("<br>");
          return;
        }

        if (linea === "CERRAR_CAJA") {
          cajaAbierta = false;
          log("Caja cerrada. Montaje finalizado con éxito.", false);
          break;
        }

        // PIEZA nombre = valor
        if (linea.startsWith("PIEZA")) {
          const rest = linea.substring(5).trim();
          if (!rest.includes("=")) {
            log(`Error en línea ${numPaso}: Sintaxis incorrecta en PIEZA (falta '=')`, true);
            consola.innerHTML = logs.join("<br>");
            return;
          }
          const [nombre, rawVal] = rest.split("=").map(s => s.trim());
          if (rawVal.startsWith('"') && rawVal.endsWith('"')) {
            piezas[nombre] = rawVal.slice(1, -1);
          } else {
            const num = parseInt(rawVal, 10);
            if (isNaN(num)) {
              log(`Error en línea ${numPaso}: Valor no reconocido '${rawVal}'`, true);
              consola.innerHTML = logs.join("<br>");
              return;
            }
            piezas[nombre] = num;
          }
        }
        // ENCAJAR nombre + num
        else if (linea.startsWith("ENCAJAR")) {
          const rest = linea.substring(7).trim();
          if (!rest.includes("+")) {
            log(`Error en línea ${numPaso}: Solo se puede ENCAJAR con '+'`, true);
            consola.innerHTML = logs.join("<br>");
            return;
          }
          const [nombre, rawNum] = rest.split("+").map(s => s.trim());
          if (!(nombre in piezas)) {
            log(`Error en línea ${numPaso}: La pieza '${nombre}' no existe en la caja`, true);
            consola.innerHTML = logs.join("<br>");
            return;
          }
          const incremento = parseInt(rawNum, 10);
          if (isNaN(incremento) || typeof piezas[nombre] !== "number") {
            log(`Error en línea ${numPaso}: No se puede encajar un valor no numérico`, true);
            consola.innerHTML = logs.join("<br>");
            return;
          }
          piezas[nombre] += incremento;
        }
        // MOSTRAR objetivo
        else if (linea.startsWith("MOSTRAR")) {
          const objetivo = linea.substring(7).trim();
          if (objetivo.startsWith('"') && objetivo.endsWith('"')) {
            log(objetivo.slice(1, -1));
          } else if (objetivo in piezas) {
            log(piezas[objetivo]);
          } else {
            log(`Error en línea ${numPaso}: Pieza '${objetivo}' no encontrada`, true);
            consola.innerHTML = logs.join("<br>");
            return;
          }
        }
        // DIBUJAR_MUEBLE tipo
        else if (linea.startsWith("DIBUJAR_MUEBLE")) {
          const tipo = linea.substring(14).trim().replace(/"/g, "").toLowerCase();
          if (tipo === "mesa") {
            const patas = piezas["patas"] || 4;
            dibujo = generarMesaAscii(patas);
          } else if (tipo === "estanteria") {
            const baldas = piezas["baldas"] || 3;
            dibujo = generarEstanteriaAscii(baldas);
          } else if (tipo === "silla") {
            dibujo = generarSillaAscii();
          } else {
            dibujo = `\n    [ ? Mueble desconocido: "${tipo}" ? ]\n`;
          }
        } else {
          log(`Error en línea ${numPaso}: Instrucción no reconocida '${linea}'`, true);
          consola.innerHTML = logs.join("<br>");
          return;
        }
      }

      if (cajaAbierta) {
        log("Aviso: El código finalizó sin CERRAR_CAJA.", true);
      }

      consola.innerHTML = logs.join("<br>");
      asciiDisplay.innerText = dibujo || "// No se ha invocado DIBUJAR_MUEBLE en este programa.";
    }

    // Iniciar con el primer ejemplo al abrir
    window.onload = () => {
      cargarEjemplo();
      ejecutarCodigo();
    };
  </script>
</body>
</html>
